name: Gate Bot (24/7)

on:
  workflow_dispatch:
  schedule:
    # প্রতি ৫ ঘণ্টায় নিজে নিজে উঠবে (একটা রানের সীমা ৬ ঘণ্টা)
    - cron: "0 */5 * * *"

concurrency:
  group: gate-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: deps
        run: pip install -r requirements.txt

      - name: restore db
        uses: actions/cache/restore@v4
        with:
          path: data
          key: gate-db-${{ github.run_id }}
          restore-keys: |
            gate-db-

      - name: run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          CHANNEL: ${{ secrets.CHANNEL }}
          CHANNEL_LINK: ${{ secrets.CHANNEL_LINK }}
          STORAGE: ${{ secrets.STORAGE }}
          DB_PATH: data/gate.db
        run: |
          # OWNER 2026-11-20: 'সব চালু থাকবে'. A 5h40m run is SUPPOSED to end here -
          # the 5-hourly cron starts the next one. `timeout` exits 124 when it ends the
          # bot normally, and that turned every healthy cycle into a red 'failure' run.
          timeout 20400 python3 gate_bot.py
          rc=$?
          if [ "$rc" -eq 124 ]; then echo 'bot reached its 5h40m limit - normal handover to the next cron'; exit 0; fi
          exit "$rc"
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - name: save db
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: gate-db-${{ github.run_id }}
